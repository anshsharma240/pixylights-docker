name: Build ARM64 Pixylights Debian Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 2.1: Checkout your repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2.2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 2.3: Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 2.4: Build and push ARM64 Docker image
      - name: Build and push ARM64 Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: buildDebian
          platforms: linux/arm64
          push: true
          tags: ghcr.io/anshsharma240/arm64/debian:bookworm
          build-args: |
            DOCKER_SOURCE=debian:bookworm

      # Optional Step 2.5: Save generated .deb packages as artifacts
      #- name: Upload .deb packages
      #  uses: actions/upload-artifact@v3
      #  with:
      #    name: deb-packages
      #    path: path/to/generated/packages/*.deb
