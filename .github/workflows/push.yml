name: Pixylights Docker Builder

on:
  push:

jobs:
  DevelopmentDockerBuilder:
    name: ${{ matrix.architecture }}/${{ matrix.distroName }}:${{ matrix.distroVersion }}
    runs-on: ${{ startsWith(matrix.architecture, 'arm') && 'ubuntu-24.04' || 'ubuntu-24.04' }}
    permissions:
      packages: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - distroName: ubuntu
            distroVersion: jammy
            architecture: amd64
          - distroName: debian
            distroVersion: bullseye
            architecture: amd64
          - distroName: debian
            distroVersion: bullseye
            architecture: arm64
          - distroName: debian
            distroVersion: bullseye
            architecture: armhf
          - distroName: archlinux
            distroVersion: latest
            architecture: amd64
          - distroName: fedora
            distroVersion: 43
            architecture: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PIXYLIGHTS_TOKEN }}

      - name: Prepare docker source
        shell: bash
        run: |
          if [[ "${{ matrix.architecture }}" == "arm64" ]]; then
            FINAL_DOCKER_SOURCE=balenalib/raspberrypi3-64:${{ matrix.distroVersion }}
          elif [[ "${{ matrix.architecture }}" == "armhf" ]]; then
            FINAL_DOCKER_SOURCE=balenalib/raspberry-pi:${{ matrix.distroVersion }}
          else
            FINAL_DOCKER_SOURCE=${{ matrix.distroName }}:${{ matrix.distroVersion }}
          fi

          if [[ "${{ matrix.distroName }}" == fedora ]]; then
            DOCKER_TOOL=buildFedora
          elif [[ "${{ matrix.distroName }}" == archlinux ]]; then
            DOCKER_TOOL=buildArch
          else
            DOCKER_TOOL=buildDebian
          fi

          echo "FINAL_DOCKER_SOURCE=$FINAL_DOCKER_SOURCE" >> $GITHUB_ENV
          echo "DOCKER_TOOL=$DOCKER_TOOL" >> $GITHUB_ENV

     - name: Make build scripts executable
  run: chmod +x buildDebian buildFedora buildArch && chmod +x scripts/build.sh

      - name: Build & push docker container
        env:
          PIXY_DOCKER_TAG: ghcr.io/pixylights-dev/${{ matrix.architecture }}/${{ matrix.distroName }}:${{ matrix.distroVersion }}
        run: |
          docker build \
            -t ${{ env.PIXY_DOCKER_TAG }} \
            --platform linux/${{ matrix.architecture }} \
            --label maintainer="Pixylights" \
            --label org.opencontainers.image.title="${{ matrix.distroName }} (${{ matrix.distroVersion }})" \
            --label org.opencontainers.image.description="Pixylights build environment" \
            --label org.opencontainers.image.url="https://pixylights.eu" \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.vendor="Pixylights" \
            --label org.opencontainers.image.licenses="MIT" \
            --build-arg DOCKER_SOURCE="${{ env.FINAL_DOCKER_SOURCE }}" \
            -f ${{ env.DOCKER_TOOL }} .

          docker push ${{ env.PIXY_DOCKER_TAG }}


