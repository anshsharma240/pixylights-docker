name: Pixylights Docker Builder

on:
  push:

jobs:
  DevelopmentDockerBuilder:
    name: ${{ matrix.architecture }}/${{ matrix.distroName }}:${{ matrix.distroVersion }}
    runs-on: ${{ startsWith(matrix.architecture, 'arm') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      packages: write
      contents: read  # needed for private repo access

    strategy:
      matrix:
        distroName: [debian]
        distroVersion: [bullseye, bookworm, trixie]
        architecture: [amd64, armhf, arm64]        
        include:
          - distroName: ubuntu
            distroVersion: jammy
            architecture: amd64
          - distroName: ubuntu
            distroVersion: noble
            architecture: amd64
          - distroName: ubuntu
            distroVersion: questing
            architecture: amd64
          - distroName: fedora
            distroVersion: 43
            architecture: amd64
          - distroName: archlinux
            distroVersion: latest
            architecture: amd64         

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.7.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEW: Setup Git authentication for private repos
      - name: Configure Git for private repo
        run: |
          git config --global url."https://${{ secrets.GITHUB_TOKEN }}:@github.com/".insteadOf "https://github.com/"

      - name: Prepare docker source
        shell: bash
        run: |
          # DOCKER SOURCE
          if [ "${{ matrix.architecture }}" = "arm64" ] && [ "${{ matrix.distroVersion }}" = "trixie" ]; then
            echo "FINAL_DOCKER_SOURCE=arm64v8/debian:${{ matrix.distroVersion }}-slim" >> $GITHUB_ENV
          elif [ "${{ matrix.architecture }}" = "armhf" ] && [ "${{ matrix.distroVersion }}" = "trixie" ]; then
            echo "FINAL_DOCKER_SOURCE=arm32v7/debian:${{ matrix.distroVersion }}-slim" >> $GITHUB_ENV
          elif [ "${{ matrix.architecture }}" = "arm64" ]; then
            echo "FINAL_DOCKER_SOURCE=balenalib/raspberrypi3-64:${{ matrix.distroVersion }}" >> $GITHUB_ENV
          elif [ "${{ matrix.architecture }}" = "armhf" ]; then
            echo "FINAL_DOCKER_SOURCE=balenalib/raspberry-pi:${{ matrix.distroVersion }}" >> $GITHUB_ENV
          else
            echo "FINAL_DOCKER_SOURCE=${{ matrix.distroName }}:${{ matrix.distroVersion }}" >> $GITHUB_ENV
          fi

          # TOOLKIT
          if [ "${{ matrix.distroName }}" = "fedora" ]; then
            echo "DOCKER_TOOL=buildFedora" >> $GITHUB_ENV
          elif [ "${{ matrix.distroName }}" = "archlinux" ]; then
            echo "DOCKER_TOOL=buildArch" >> $GITHUB_ENV
          else
            echo "DOCKER_TOOL=buildDebian" >> $GITHUB_ENV
          fi

      - name: Make build scripts executable
        run: chmod +x buildDebian buildFedora buildArch

      - name: Debug environment variables
        run: |
          echo "DOCKER_TOOL=${{ env.DOCKER_TOOL }}"
          echo "FINAL_DOCKER_SOURCE=${{ env.FINAL_DOCKER_SOURCE }}"

      - name: Build & push docker container
        env:
          Pixylights_DOCKER_TAG: ghcr.io/pixylights-dev/${{ matrix.architecture }}/${{ matrix.distroName }}:${{ matrix.distroVersion }}
        run: |
          docker build \
            --pull \
            -t ${{ env.Pixylights_DOCKER_TAG }} \
            --platform linux/${{ matrix.architecture }} \
            --label maintainer="Pixylights" \
            --label org.opencontainers.image.title="${{ matrix.distroName }} (${{ matrix.distroVersion }})" \
            --label org.opencontainers.image.description="Pixylights build environment" \
            --label org.opencontainers.image.url="https://pixylights.eu" \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.vendor="Pixylights" \
            --label org.opencontainers.image.licenses="MIT" \
            --build-arg DOCKER_SOURCE="${{ env.FINAL_DOCKER_SOURCE }}" \
            -f ${{ env.DOCKER_TOOL }} .

          docker push ${{ env.Pixylights_DOCKER_TAG }}
