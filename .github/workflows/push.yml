name: HyperHDR Multi-Platform Builder

on:
  push:

jobs:
  linux_builds:
    name: Linux: ${{ matrix.architecture }}/${{ matrix.distroName }}:${{ matrix.distroVersion }}
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          # Debian/Ubuntu
          - distroName: debian
            distroVersion: bullseye
            architecture: amd64
          - distroName: debian
            distroVersion: bullseye
            architecture: arm64
          - distroName: debian
            distroVersion: bullseye
            architecture: armhf
          - distroName: debian
            distroVersion: trixie
            architecture: arm64
          - distroName: debian
            distroVersion: trixie
            architecture: armhf
          - distroName: ubuntu
            distroVersion: jammy
            architecture: amd64
          - distroName: ubuntu
            distroVersion: noble
            architecture: amd64
          # Archlinux
          - distroName: archlinux
            distroVersion: latest
            architecture: amd64
          # Fedora
          - distroName: fedora
            distroVersion: 43
            architecture: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git for private repo
        run: |
          git config --global url."https://${{ secrets.GITHUB_TOKEN }}:@github.com/".insteadOf "https://github.com/"

      - name: Prepare Docker source
        shell: bash
        run: |
          # ARM vs AMD
          if [[ "${{ matrix.architecture }}" == arm64* ]] || [[ "${{ matrix.architecture }}" == armhf* ]]; then
              export FINAL_DOCKER_SOURCE=balenalib/raspberrypi3-64:${{ matrix.distroVersion }}
          else
              export FINAL_DOCKER_SOURCE=${{ matrix.distroName }}:${{ matrix.distroVersion }}
          fi

          # Determine build script
          if [[ "${{ matrix.distroName }}" == fedora ]]; then
              export DOCKER_TOOL=buildFedora
          elif [[ "${{ matrix.distroName }}" == archlinux ]]; then
              export DOCKER_TOOL=buildArch
          else
              export DOCKER_TOOL=buildDebian
          fi

          echo "FINAL_DOCKER_SOURCE=$FINAL_DOCKER_SOURCE" >> $GITHUB_ENV
          echo "DOCKER_TOOL=$DOCKER_TOOL" >> $GITHUB_ENV

      - name: Make build scripts executable
        run: chmod +x buildDebian buildFedora buildArch

      - name: Build & push docker container
        env:
          Pixylights_DOCKER_TAG: ghcr.io/pixylights-dev/${{ matrix.architecture }}/${{ matrix.distroName }}:${{ matrix.distroVersion }}
        run: |
          docker build \
            --pull \
            -t ${{ env.Pixylights_DOCKER_TAG }} \
            --platform linux/${{ matrix.architecture }} \
            --build-arg DOCKER_SOURCE="${{ env.FINAL_DOCKER_SOURCE }}" \
            -f ${{ env.DOCKER_TOOL }} .

          docker push ${{ env.Pixylights_DOCKER_TAG }}

  mac_builds:
    name: macOS Builds
    runs-on: macos-14
    strategy:
      matrix:
        architecture: [x86_64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build macOS installer
        shell: bash
        run: |
          ARCH=${{ matrix.architecture }}
          echo "Building HyperHDR macOS installer for $ARCH..."
          ./buildMac.sh $ARCH
